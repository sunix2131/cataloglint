[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cataloglint"
version = "0.1.0"
description = "Offline consistency checks for CommerceML catalog and offer exports"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Sergey"}]
dependencies = ["defusedxml>=0.7.1,<0.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
cataloglint = "cataloglint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
